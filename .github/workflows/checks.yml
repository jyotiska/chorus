name: Checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
            web: true
          - os: ubuntu-latest
            python: '3.13'
            web: false
          - os: macos-latest
            python: '3.11'
            web: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHON_DOTENV_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: python -m pip install uv==0.9.8
      - run: uv sync --locked --extra dev
      - run: npm ci --prefix web
        if: matrix.web
      - run: npx playwright install --with-deps chromium
        working-directory: web
        if: matrix.web
      - run: .venv/bin/python scripts/check.py
        if: matrix.web
      - run: .venv/bin/python scripts/check.py --python-only
        if: ${{ !matrix.web }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: checks-${{ matrix.os }}-${{ matrix.python }}
          path: |
            coverage.xml
            web/playwright-report/
            web/test-results/
          retention-days: 7
