[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chorus"
version = "0.2.0"
description = "Chorus simulation framework and local API platform"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "pydantic>=2",
    "python-dotenv>=1.0",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "httpx>=0.28,<1",
    "sqlalchemy>=2,<3",
    "markdown-it-py>=3,<5",
    "regex>=2024",
]

[project.scripts]
chorus = "chorus.cli.main:app"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3",
    "hypothesis>=6",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["chorus*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.setuptools.package-data]
chorus = ["catalog/*.json", "services/*.json"]
