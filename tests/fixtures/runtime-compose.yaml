services:
  controller:
    environment:
      CHORUS_NPM_UPSTREAM: http://fake-provider:11435

  chorus:
    environment:
      OLLAMA_HOST: http://fake-provider:11435
      CHORUS_PACING: "0.05"
    depends_on:
      fake-provider:
        condition: service_healthy

  fake-provider:
    image: node:24-bookworm-slim
    environment:
      OLLAMA_TEST_HOST: 0.0.0.0
    command: [node, /fixture/ollama-server.mjs]
    volumes:
      - ./tests/fixtures/ollama-server.mjs:/fixture/ollama-server.mjs:ro
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:11435/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 3s
      retries: 12
